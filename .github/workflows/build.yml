name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile check — no Apple identity required on the runner.
  build:
    name: Build (unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show tools
        run: |
          xcodebuild -version
          ls -la Avert Avert.xcodeproj

      - name: Build (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Avert.xcodeproj \
            -scheme Avert \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Confirm app product
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Avert.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"

  # Signed archive when repository secrets are present (see docs/SIGNING.md).
  sign:
    name: Sign (Developer ID)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
      APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        if: ${{ env.APPLE_P12_BASE64 != '' }}
        uses: actions/checkout@v4

      - name: Skip when secrets missing
        if: ${{ env.APPLE_P12_BASE64 == '' }}
        run: |
          echo "APPLE_P12_BASE64 not set — skipping signed job."
          echo "Add secrets from local certs/ (see docs/SIGNING.md)."

      - name: Select Xcode
        if: ${{ env.APPLE_P12_BASE64 != '' }}
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import certificate
        if: ${{ env.APPLE_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/Certificates.p12"
          KEYCHAIN="$RUNNER_TEMP/avert.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$APPLE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Prefer Developer ID; fall back to Apple Distribution / Development.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Apple Distribution:[^"]*\)".*/\1/p' | head -1)
          fi
          if [[ -z "$IDENTITY" ]]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Apple Development:[^"]*\)".*/\1/p' | head -1)
          fi
          echo "Using identity: ${IDENTITY:-none}"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY_NAME=$IDENTITY" >> "$GITHUB_ENV"
          if [[ "$IDENTITY" == Developer\ ID\ Application:* ]]; then
            echo "EXPORT_METHOD=developer-id" >> "$GITHUB_ENV"
            echo "CAN_NOTARIZE=true" >> "$GITHUB_ENV"
          elif [[ "$IDENTITY" == Apple\ Distribution:* ]]; then
            echo "EXPORT_METHOD=mac-application" >> "$GITHUB_ENV"
            echo "CAN_NOTARIZE=false" >> "$GITHUB_ENV"
          else
            echo "EXPORT_METHOD=development" >> "$GITHUB_ENV"
            echo "CAN_NOTARIZE=false" >> "$GITHUB_ENV"
          fi

      - name: Install App Store Connect API key
        if: ${{ env.APPLE_P12_BASE64 != '' && env.APPLE_API_KEY_BASE64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive & export
        if: ${{ env.APPLE_P12_BASE64 != '' && env.CODE_SIGN_IDENTITY_NAME != '' }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          DERIVED="$RUNNER_TEMP/DerivedDataSigned"
          ARCHIVE="$RUNNER_TEMP/Avert.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT"

          xcodebuild archive \
            -project Avert.xcodeproj \
            -scheme Avert \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY_NAME" \
            ENABLE_HARDENED_RUNTIME=YES

          # Developer ID export when available; otherwise keep the .xcarchive as the artifact.
          if [[ "$EXPORT_METHOD" == "developer-id" ]]; then
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath "$EXPORT" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          else
            echo "No Developer ID cert in p12 — uploading xcarchive (Distribution/Development only)."
            cp -R "$ARCHIVE" "$EXPORT/Avert.xcarchive"
          fi

          ls -la "$EXPORT"
          echo "EXPORT_PATH=$EXPORT" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Notarize (Developer ID only)
        if: ${{ env.APPLE_P12_BASE64 != '' && env.APPLE_API_KEY_BASE64 != '' && env.CAN_NOTARIZE == 'true' }}
        run: |
          set -euo pipefail
          APP=$(find "$EXPORT_PATH" -name 'Avert.app' -maxdepth 3 | head -1)
          test -n "$APP"
          ZIP="$RUNNER_TEMP/Avert.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          echo "Notarized: $APP"

      - name: Upload signed app
        if: ${{ env.APPLE_P12_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Avert-signed-macos
          path: ${{ env.EXPORT_PATH }}
          if-no-files-found: warn
